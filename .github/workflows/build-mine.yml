name: Build my image

# 本 fork 自己的镜像构建, 与上游的 docker.yml 分开:
# 上游那份只在 v* tag 触发 (我们不推 tag, 所以它永远不会跑), 这里只手动触发.
# 触发方式: Actions → Build my image → Run workflow, 或 scripts/sync-upstream.ps1 -Push.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amane" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 部署机是 x86_64, 只构一个平台; 需要 arm64 时加回 platforms 与 setup-qemu-action.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
